<div class="container py-4">
  <h1 class="text-center mb-4">🎬 Películas populares</h1>

  <div class="row g-4">
    @for (movie of movies(); track movie.id) {
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="card h-100 shadow-sm">
          <img [src]="imageBaseUrl + movie.poster_path"
               class="card-img-top"
               [alt]="movie.title">

          <div class="card-body">
            <h5 class="card-title">{{ movie.title }}</h5>
            <p class="card-text text-muted small">{{ movie.overview }}</p>
          </div>

          <div class="card-footer d-flex justify-content-between align-items-center">
            <small class="text-muted">{{ movie.release_date }}</small>
            <span class="badge bg-warning text-dark">⭐ {{ movie.vote_average }}</span>
          </div>
        </div>
      </div>
    } @empty {
      <div class="col-12">
        <div class="alert alert-info text-center">No hay películas para mostrar.</div>
      </div>
    }
  </div>
</div>
