<div class="container mt-4">

  <app-custom-progress-bar
    [value]="value"
    [color]="color"
    [striped]="striped"
    [animated]="animated"
    [showText]="showText"
  />

  <div class="mt-4">
    <label class="form-label">Valor: {{ value }}</label>
    <input type="range" class="form-range" min="0" max="100" [(ngModel)]="value" />

    <label class="form-label mt-3">Color</label>
    <select class="form-select" [(ngModel)]="color">
      <option value="primary">Primary</option>
      <option value="success">Success</option>
      <option value="danger">Danger</option>
      <option value="warning">Warning</option>
      <option value="info">Info</option>
    </select>

    <div class="form-check mt-3">
      <input class="form-check-input" type="checkbox" id="striped" [(ngModel)]="striped" />
      <label class="form-check-label" for="striped">Striped</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="animated" [(ngModel)]="animated" />
      <label class="form-check-label" for="animated">Animated</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="showText" [(ngModel)]="showText" />
      <label class="form-check-label" for="showText">Mostrar porcentaje</label>
    </div>
  </div>
</div>
