<fieldset class="card card-body mb-4" [formGroup]="group">
  <legend class="h5">Datos de la cuenta</legend>
  <div class="row g-3">

    <div class="col-md-6">
      <label class="form-label" for="usuario">Nombre de usuario</label>
      <input id="usuario" type="text" class="form-control"
             formControlName="usuario" [class.is-invalid]="invalido('usuario')">
      <app-campo-errores [control]="group.get('usuario')" [mensajes]="msgUsuario" />
    </div>

    <div class="col-md-6">
      <label class="form-label" for="email">Email</label>
      <input id="email" type="email" class="form-control"
             formControlName="email" [class.is-invalid]="invalido('email')">
      <app-campo-errores [control]="group.get('email')" [mensajes]="msgEmail" />
    </div>

    <div class="col-12">
      <label class="form-label" for="password">Contraseña</label>
      <input id="password" type="password" class="form-control"
             formControlName="password" [class.is-invalid]="invalido('password')">
      <app-campo-errores [control]="group.get('password')" [mensajes]="msgPassword" />
    </div>

  </div>
</fieldset>
