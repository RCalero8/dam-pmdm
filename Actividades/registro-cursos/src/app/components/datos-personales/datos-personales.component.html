<fieldset class="card card-body mb-4" [formGroup]="group">
  <legend class="h5">Datos personales</legend>
  <div class="row g-3">

    <div class="col-md-6">
      <label class="form-label" for="nombre">Nombre</label>
      <input id="nombre" type="text" class="form-control"
             formControlName="nombre" [class.is-invalid]="invalido('nombre')">
      <app-campo-errores [control]="group.get('nombre')" [mensajes]="msgNombre" />
    </div>

    <div class="col-md-6">
      <label class="form-label" for="apellidos">Apellidos</label>
      <input id="apellidos" type="text" class="form-control"
             formControlName="apellidos" [class.is-invalid]="invalido('apellidos')">
      <app-campo-errores [control]="group.get('apellidos')" [mensajes]="msgApellidos" />
    </div>

    <div class="col-md-6">
      <label class="form-label" for="dni">DNI / NIE</label>
      <input id="dni" type="text" class="form-control" placeholder="12345678Z / X1234567L"
             formControlName="dni" [class.is-invalid]="invalido('dni')">
      <app-campo-errores [control]="group.get('dni')" [mensajes]="msgDni" />
    </div>

    <div class="col-md-6">
      <label class="form-label" for="telefono">Teléfono móvil</label>
      <input id="telefono" type="tel" class="form-control" placeholder="+34 600123456"
             formControlName="telefono" [class.is-invalid]="invalido('telefono')">
      <app-campo-errores [control]="group.get('telefono')" [mensajes]="msgTelefono" />
    </div>

  </div>
</fieldset>
