<section class="card" style="max-width: 320px">
    <img [src]="pokemon()?.img" class="card-img-top" alt="...">
    <div class="card-body">
        <h4 class="card-title">{{pokemon()?.name}}</h4>
        <h5 class="card-title">#{{pokemon()?.numero}}</h5>
        <p class="card-text">{{pokemon()?.tipo}}</p>
        <a href="#" class="btn-solid theme-primary">View player detail</a>
    </div>
</section>
