<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio1 Rocio Calero</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        #tabla td[contenteditable] {
            min-width: 90px;
        }

        #tabla td[contenteditable]:focus {
            outline: 2px solid #0d6efd;
            background: #f0f6ff;
        }

        .ctrl-cell,
        .ctrl-row th {
            width: 1%;
            background: #f8f9fa;
            text-align: center;
            vertical-align: middle;
        }
    </style>
</head>

<body class="bg-body-tertiary">
    <div class="containern py-4">
        <h1 class="h3 mb-4">Generador de Tablas</h1>
    </div>

    <div class="d-fle flex-wrap gap-2 mb-3">
        <button id="añadirFila" class="btn btn-success">Añadir fila</button>
        <button id="añadirCol" class="btn btn-success">Añadir Columna</button>
        <button id="eliminarTabla" class="btn btn-danger ms-md-auto">Eliminar tabla completa</button>
    </div>

    <p class="text-musted small">HAz clic en una celda para escribir. Usa los botones x para borrar filas o columnas</p>
    
    <div id="contenedorTabla" class="table-responsive bg-white shadow-sm">
        <!--Tabla inicial 3 columnas-->
        <table id="tabla" class="table table-bordered align-middle mb-0">
            <tr class="ctrl-row">
                <th></th>
                <th><button class="btn btn-sm btn-outline-danger btn-del-col" title="Eliminar columna"></button></th>
                <th><button class="btn btn-sm btn-outline-danger btn-del-col"  title="Eliminar columna"></button></th>
                <th><button class="btn btn-sm btn-outline-danger btn-del-col"  title="Eliminar columna"></button></th>
            </tr>
        </table>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
