<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generador visual de tablas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #tabla td[contenteditable] { min-width: 90px; }
    #tabla td[contenteditable]:focus { outline: 2px solid #0d6efd; background: #f0f6ff; }
    .ctrl-cell, .ctrl-row th { width: 1%; background: #f8f9fa; text-align: center; vertical-align: middle; }
  </style>
</head>
<body class="bg-body-tertiary">
  <div class="container py-4">
    <h1 class="h3 mb-4">Generador visual de tablas</h1>

    <!-- Asistente inicial -->
    <div id="asistente" class="card shadow-sm mx-auto" style="max-width: 420px;">
      <div class="card-body">
        <h2 class="h5 card-title">Asistente de creación</h2>
        <p class="text-muted">Indica el tamaño inicial de la tabla.</p>
        <div class="mb-3">
          <label for="numFilas" class="form-label">¿Cuántas filas?</label>
          <input type="number" id="numFilas" class="form-control" min="1" max="50" value="3">
        </div>
        <div class="mb-3">
          <label for="numCols" class="form-label">¿Cuántas columnas?</label>
          <input type="number" id="numCols" class="form-control" min="1" max="20" value="3">
        </div>
        <div id="errorAsistente" class="text-danger small mb-2 d-none">
          Introduce valores válidos (filas: 1-50, columnas: 1-20).
        </div>
        <button id="btnCrear" class="btn btn-primary w-100">Crear tabla</button>
      </div>
    </div>

    <!-- Editor -->
    <div id="editor" class="d-none">
      <div class="d-flex flex-wrap gap-2 mb-3">
        <button id="btnAddFila" class="btn btn-success">+ Añadir fila</button>
        <button id="btnAddCol" class="btn btn-success">+ Añadir columna</button>
        <button id="btnEliminarTabla" class="btn btn-danger ms-md-auto">Eliminar tabla completa</button>
      </div>
      <p class="text-muted small">Haz clic en una celda para escribir. Usa los botones ✕ para borrar filas o columnas.</p>
      <div class="table-responsive bg-white shadow-sm">
        <table id="tabla" class="table table-bordered align-middle mb-0"></table>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="Actividad1.js"></script>
</body>
</html>
