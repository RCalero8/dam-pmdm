<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cifrado César PRO </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5" style="max-width: 720px;">

        <h1 class="text-center mb-4">Cifrado César</h1>

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <div class="mb-3">
                    <label for="texto" class="form-label fw-bold">Texto de entrada</label>
                    <textarea id="texto" class="form-control" rows="4"
                        placeholder="Escribe aquí el texto..."></textarea>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="desplazamiento" class="form-label fw-bold">Desplazamiento</label>
                        <input type="number" id="desplazamiento" class="form-control" value="3" min="0" max="1000">
                    </div>
                    <div class="col-md-6">
                        <label for="operacion" class="form-label fw-bold">Operación</label>
                        <select id="operacion" class="form-select">
                            <option value="+">Cifrar (+desplazamiento)</option>
                            <option value="-">Descifrar (-desplazamiento)</option>
                        </select>
                    </div>
                </div>

                <div id="aviso" class="alert alert-danger d-none" role="alert">
                    Introduce un desplazamiento válido.
                </div>

                <button id="btnAplicar" class="btn btn-primary w-100 mb-3">Aplicar</button>

                <div>
                    <label for="resultado" class="form-label fw-bold">Resultado</label>
                    <textarea id="resultado" class="form-control bg-light" rows="4" readonly></textarea>
                </div>

            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="index.js"></script>
</body>

</html>
